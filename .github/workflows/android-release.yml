name: Android Release APK

on:
  workflow_dispatch:
  push:
    tags: ['musicode-v*']

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: android
        env:
          EXPO_USE_PRECOMPILED_MODULES: '0'
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect and verify APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p dist
          cp "$APK" "dist/musicode-${VERSION}.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "dist/musicode-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: musicode-apk
          path: dist/*.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
